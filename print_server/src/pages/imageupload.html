<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Page Title</title>
  <link rel='stylesheet' href='main.css'>
  <style>
    @keyframes fadeIn {
      from {
        opacity: 0%;
        transform: translateY(-20px);
      }

      to {
        opacity: 100%;
        transform: translateY(0px);
      }
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;

      animation-name: fadeIn;
      animation-timing-function: ease-in-out;
      animation-duration: 500ms;
      animation-iteration-count: 1;
      animation-delay: 0s;
      animation-fill-mode: none;
      animation-direction: normal;
    }
    .container {
      display: flex;
      flex-direction: column;
      /* justify-content: center; */
      align-items: center;
      min-width: 400px;
      min-height: 400px;
      width: 50vw;
      height: 70vh;
    }
    cropper-canvas {
      width: 100%;
      height: 90%;
    }
    cropper-selector {
      height: 62%;
      width: 46%;
    }

  </style>
</head>

<body>
  <div class="container" id="cropper-container">
    <h1>Upload and preview</h1>
      <label>
        Click here to choose image!
        <input hidden type="file" id="imageSelect" accept="image/*">
      </label>
      <img id="preview" src="#" alt="Image Preview" style="display:none;" />
      <button id="imageUpload">
        Click here to upload!
      </button>
      <form action="/upload_images/" enctype="multipart/form-data" method="post" target="_blank">
        <input hidden id="imageUploadInput" multiple type="file" name="files"/>
        <input id="imageUploadSubmit" type="submit" value="Submit" formtarget="_blank"/>
      </form>
  </div>

  <script src="../../plugins/cropper.js"></script>
  <script>
    document.getElementById('imageSelect').addEventListener('change', async function () {
      let file = this.files[0];
      let reader = new FileReader();

      // Remove any previous cropper canvases
      let cropper = Array.from(document.getElementsByTagName("cropper-canvas"))
      for (let i=0; i<cropper.length; i++){
          let element = cropper[i]
          element.remove()
      }

      reader.onload = function (event) {
        let base64String = event.target.result;
        preview.src = base64String;
        preview.style.display = 'block';
      };

      reader.onloadend = async function (event) {
        await new Cropper.default(preview)

        let selector = Array.from(document.getElementsByTagName("cropper-selection"))
        let shade = Array.from(document.getElementsByTagName("cropper-shade"))
        let selectorElements = Array.prototype.concat(selector, shade)
        console.log(selectorElements)
        for (let i=0; i<selectorElements.length; i++){
          let element = selectorElements[i]
          console.log(element)
          element.removeAttribute("movable")
          element.removeAttribute("resizable")
          let aspect = 4 / 6
          let scale = 3/4

          let parentHeight = element.parentElement.clientHeight
          let parentWidth = element.parentElement.clientWidth
          let height = parentHeight * scale
          let width = height * aspect
          element.setAttribute("height", height)
          element.setAttribute("width", width)
          let y = (parentHeight - height) / 2
          let x = (parentWidth - width) / 2
          element.setAttribute("x", x)
          element.setAttribute("y", y)
          // let style = element.getAttribute("style")
          // element.setAttribute("style", style + ";height: " + height +"px ;width: " + width + "px;")
        };

        let handle = document.getElementsByTagName("cropper-handle")
        for (let i=0; i<handle.length; i++){
          let element = handle.item(i)
          if(element.getAttribute("action") !== "move"){
            element.setAttribute("hidden", true)
          }
        };
      }

      reader.readAsDataURL(file);

    });

    document.getElementById('imageUpload').addEventListener('click', async function () {
      let selection = document.getElementsByTagName("cropper-selection")
      selection.$toCanvas
      c = await selection[0].$toCanvas({width:400, height:600})

      c.toBlob((blob)=>{
        let url = URL.createObjectURL(blob)
        let img = document.createElement("img")
        let fileName = "hasFilename.jpg"
        let file = new File([blob], fileName,{type:"image/jpeg", lastModified:new Date().getTime()}, 'utf-8');
        let container = new DataTransfer();
        container.items.add(file);
        document.querySelector("#imageUploadInput").files = container.files;
        // document.querySelector("#imageUploadSubmit").dispatchEvent(new Event("click"))
      })
    })
  </script>
</body>

</html>
