<!DOCTYPE html>
<html lang='en'>

<head>
  <meta charset='utf-8'>
  <meta name='viewport' content='width=device-width, initial-scale=1'>
  <title>Liz & Paul's Wedding Memories</title>
  <style>
    @keyframes dropFadeIn {
      from {
        opacity: 0%;
        transform: translateY(-20px);
      }

      to {
        opacity: 100%;
        transform: translateY(0px);
      }
    }

    @keyframes fadeIn {
      from {
        opacity: 0%;
        transform: scale(0.95);
      }

      to {
        opacity: 100%;
        transform: scale(1);
      }
    }

    @keyframes spin {
      to {transform: rotate(360deg) }
    }

    * {
      font-family: 'Times New Roman', Times, serif;
      color: #444444;
      font-weight: 400;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;

      animation: dropFadeIn ease-in-out 500ms;
    }

    h1 {
      margin-top: 0.33em;
      margin-bottom: 0.33em;
      font-style: italic;
    }

    button {
      margin: 5px;
      padding: 5px;
      padding-left: 10px;
      padding-right: 10px;
    }


    div#background {
      position: absolute;
      top: 0px;
      left: 0px;
      align-self: baseline;
      overflow:  hidden;
      height: 100vh;
      width: 100vw;
      z-index: -1;
    }

    div#background::after {
      position: absolute;
      top: -50vh;
      left: -50vw;
      content: '';
      display: block;
      height: max(200vh, 200vw);
      width: max(200vh, 200vw);
      z-index: -1;

      background:  linear-gradient(#de8e8e, #ffffff, #818aea);
      animation: spin linear 60s infinite;

    }

    div#container {
      display: flex;
      flex-direction: column;
      /* justify-content: center; */
      align-items: center;

      min-width: 300px;
      min-height: 400px;
      width: 50vw;
      height: 70vh;

      padding: 20px;
      background: #ffffff;
      border-radius: 10px;
      margin: 10px;
      box-shadow: 5px 5px 3px #CCCCCC ;
    }

    div#cropperContainer {
      width: 100%;
      height: 90%;
      background: #ffffff;
      margin: 10px;
      box-shadow: inset 5px 5px 3px #CCCCCC ;
    }

    div#controlBar {
      display: flex;
      flex-direction: row;
    }

    cropper-canvas {
      width: 100%;
      height: 100%;

      animation: fadeIn ease-in-out 500ms;
    }

    cropper-selector {
      height: 62%;
      width: 46%;
    }
  </style>
</head>

<body>
  <div id="background"></div>
  <div id="container">
    <h1>Print a photo!</h1>
    <div id="cropperContainer">
      <img id="preview" src="#" alt="Image Preview" style="display:none;" />
    </div>
    <div id="controlBar">
      <button id="imageSelect">
        <label style="display: block; position: relative; width: 100%; height: 100%; top: 0px; left: 0px;">
          Select photo
          <input hidden type="file" id="imageSelectInput" accept="image/*">
        </label>
      </button>
      <button disabled id="imageUpload">
        Upload
      </button>
    </div>
  </div>

  <script src="../../plugins/cropper.js"></script>
  <script>
    const PRINT_HEIGHT=600
    const PRINT_WIDTH=400

    document.getElementById('imageSelectInput').addEventListener('change', async function () {
      let file = this.files[0];
      let reader = new FileReader();

      // Remove any previous cropper canvases
      let cropper = Array.from(document.getElementsByTagName("cropper-canvas"))
      for (let i=0; i<cropper.length; i++){
          let element = cropper[i]
          element.remove()
      }

      reader.onload = function (event) {
        let base64String = event.target.result;
        preview.src = base64String;
        preview.style.display = 'block';
      };

      reader.onloadend = async function (event) {
        await new Cropper.default(preview)

        // Remove no-texture background
        let canvas = Array.from(document.getElementsByTagName("cropper-canvas"))[0]
        canvas.removeAttribute("background")

        let aspect = PRINT_WIDTH / PRINT_HEIGHT
        let scale = 3 / 4
        let parentHeight = canvas.clientHeight
        let parentWidth = canvas.clientWidth
        let height = parentHeight * scale
        let width = height * aspect
        let y = (parentHeight - height) / 2
        let x = (parentWidth - width) / 2

        // Resize and reposition selection area and shade
        let selector = Array.from(document.getElementsByTagName("cropper-selection"))
        let shade = Array.from(document.getElementsByTagName("cropper-shade"))
        let selectorElements = Array.prototype.concat(selector, shade)
        for (let i=0; i<selectorElements.length; i++){
          let element = selectorElements[i]
          element.setAttribute("height", height)
          element.setAttribute("width", width)
          element.setAttribute("x", x)
          element.setAttribute("y", y)
          element.removeAttribute("movable")
          element.removeAttribute("resizable")
          element.$render()
        };

        // Remove unused cropper controls, remove opacity on selection window
        let handle = document.getElementsByTagName("cropper-handle")
        for (let i=0; i<handle.length; i++){
          let element = handle.item(i)
          if(element.getAttribute("action") === "move"){
            element.setAttribute("theme-color", "rgba(255, 255, 255, 0)")
          } else {
            element.setAttribute("hidden", true)
          }
        };

        // Enable upload button
        let uploadButton = document.querySelector('button#imageUpload')
        uploadButton.removeAttribute("disabled")

        // Resize and reposition image
        let image = Array.from(document.getElementsByTagName("cropper-image"))[0]
        image.$center("contain")
        image.removeAttribute("rotatable", false)
        image.removeAttribute("skewable", false)

        // Wait for image to load
        image.$ready(() => {
          image.$center("contain")
        })

        // Wait for animation to end
        // The fade in animation can take a while, it uses transform
        // which conflicts with the $center method
        canvas.addEventListener("animationend", () => {
          image.$center("contain")
        })
      }

      reader.readAsDataURL(file);
    });



    document.querySelector('button#imageUpload').addEventListener('click', async function (event) {
      event.preventDefault();

      let selection = document.getElementsByTagName("cropper-selection")
      canvas = await selection[0].$toCanvas({width:PRINT_WIDTH, height:PRINT_HEIGHT})

      await canvas.toBlob(async (blob)=>{
        let file = new File([blob], "blob", {type:"image/jpeg", lastModified:new Date().getTime()}, 'utf-8');
        let container = new DataTransfer()
        container.items.add(file)
        let formData = new FormData()
        formData.append("files", container.files[0], "image.jpeg")
        const response = await fetch("/upload_images/", {
          method: "POST",
          body: formData,
        });
        console.log(response)
      })
    })
  </script>
</body>

</html>
