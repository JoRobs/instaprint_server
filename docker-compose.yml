networks:
  default:
  internal-cloudflare:
    internal: true
  internal-backend:
    internal: true
  dozzle:

services:
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared@sha256:9b49eed8f62806d5d45ddf59ecefb5710429598ea6d3fcccd2af938f621b2b07
    restart: ${RESTART:-unless-stopped}
    networks:
      - default
      - internal-cloudflare
    volumes:
      - ./cloudflared/config.yml:/cloudflared-config.yml
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate --config=/cloudflared-config.yml run

  print_server:
    container_name: print_server
    image: instaprint_frontend:latest
    restart: ${RESTART:-unless-stopped}
    # networks:
    #   - internal-cloudflare
    #   - internal-backend
    ports:
      - 8000:80
    environment:
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_LEVEL=${LOG_LEVEL}
    volumes:
      - ./frontend_server/static:/static
      - ./frontend_server/resources:/resources
      - ./frontend_server/plugins:/plugins

  print_server_backend:
    container_name: print_server_backend
    image: instaprint_backend:latest
    restart: ${RESTART:-unless-stopped}
    # networks:
    #   - internal-backend
    ports:
     - 8001:80
    environment:
      - DUMMY_PRINTER=${DUMMY_PRINTER:-False}
      - ENVIRONMENT=${ENVIRONMENT}
      - LOG_LEVEL=${LOG_LEVEL}
      - LOG_LEVEL_BLEAK=${LOG_LEVEL_BLEAK}
      - LOG_LEVEL_PYINSTAXBLE=${LOG_LEVEL_PYINSTAXBLE}
      - PRINTER_ADDRESS=${PRINTER_ADDRESS}
      - PRINTER_NAME=${PRINTER_NAME}
      - PRINTING_ENABLED=${PRINTING_ENABLED}
    volumes:
      - ./data/print_server:/data
      - /var/run/dbus/:/run/dbus/
    security_opt:
      - apparmor=docker-allow-dbus

  dozzle:
    container_name: dozzle
    image: amir20/dozzle@sha256:a7d69d20891d3dcc82636e24afa4c1c162b41d0673ef798b14f09e6b69accc5a
    user: "0" # requires root user for reading docker socket
    networks:
      - dozzle
    ports:
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/dozzle:/data
