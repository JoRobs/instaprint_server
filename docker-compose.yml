

services:
  cloudflared:
    container_name: cloudflared
    image: cloudflare/cloudflared:2026.8.3
    restart: unless-stopped
    volumes:
      - ./cloudflared/config.yml:/cloudflared-config.yml
      #- ./cloudflared/credentials.json:/cloudflared-credentials.json
      #- ./cloudflared/cert.pem:/etc/cloudflared/cert.pem
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate --config=/cloudflared-config.yml run

  print_server:
    container_name: print_server
    image: instaprint:latest
    restart: unless-stopped
    environment:
      - PRINTER_ADDRESS=${PRINTER_ADDRESS}
      - PRINTER_NAME=${PRINTER_NAME}
      - PRINTING_ENABLED=${PRINTING_ENABLED}
    volumes:
      - ./data/print_server:/data
      - /var/run/dbus/:/run/dbus/
      - ./print_server/static:/static
      - ./print_server/resources:/resources
      - ./print_server/plugins:/plugins
    ports:
      - 8000:80
    security_opt:
      - apparmor=docker-allow-dbus
